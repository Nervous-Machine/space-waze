<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<rect width="1240" height="720" fill="#0a0a0f"/>
<defs>
<linearGradient id="g0" gradientUnits="userSpaceOnUse" x1="565" y1="165" x2="483" y2="247"><stop offset="0" stop-color="#00d4ff"/><stop offset="1" stop-color="#7b2ff7"/></linearGradient>
<linearGradient id="g1" gradientUnits="userSpaceOnUse" x1="195" y1="165" x2="277" y2="247"><stop offset="0" stop-color="#00d4ff"/><stop offset="1" stop-color="#7b2ff7"/></linearGradient>
<linearGradient id="g2" gradientUnits="userSpaceOnUse" x1="195" y1="535" x2="277" y2="453"><stop offset="0" stop-color="#00d4ff"/><stop offset="1" stop-color="#7b2ff7"/></linearGradient>
<linearGradient id="g3" gradientUnits="userSpaceOnUse" x1="565" y1="535" x2="483" y2="453"><stop offset="0" stop-color="#00d4ff"/><stop offset="1" stop-color="#7b2ff7"/></linearGradient>
<linearGradient id="gk" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00d4ff"/><stop offset="1" stop-color="#7b2ff7"/></linearGradient>
<path id="hullArc" d="M 158 350 A 222 222 0 0 1 602 350" fill="none"/>
</defs>
<text x="40" y="46" fill="#e0e0e0" font-size="24" font-weight="700">One kernel, two boundaries</text>
<text x="40" y="70" fill="#888" font-size="14">internal &#215; external &#8212; and what it costs</text>
<circle cx="380" cy="350" r="302" fill="rgba(0,212,255,0.05)" stroke="rgba(0,212,255,0.30)" stroke-width="1.5"/>
<circle cx="380" cy="350" r="222" fill="#0a0a0f"/>
<circle cx="380" cy="350" r="222" fill="rgba(123,47,247,0.07)"/>
<circle cx="380" cy="350" r="222" fill="none" stroke="#ffd700" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="8 8"/>
<text font-size="13.5" letter-spacing="2.5" fill="#ffd700" fill-opacity="0.9"><textPath href="#hullArc" startOffset="50%" text-anchor="middle">THE DANGEROUS EDGE CASES</textPath></text>
<line x1="565" y1="165" x2="483" y2="247" stroke="url(#g0)" stroke-width="6"/>
<circle cx="565" cy="165" r="10" fill="#00d4ff"/>
<circle cx="483" cy="247" r="10" fill="#7b2ff7"/>
<text x="608" y="116" fill="#7fdcf5" font-size="15" font-weight="600" text-anchor="start">neutral density</text>
<text x="516" y="219" fill="#c9b3f5" font-size="14" font-weight="600" text-anchor="middle" stroke="#0a0a0f" stroke-width="7" paint-order="stroke">drag &#183; attitude</text>
<line x1="195" y1="165" x2="277" y2="247" stroke="url(#g1)" stroke-width="6"/>
<circle cx="195" cy="165" r="10" fill="#00d4ff"/>
<circle cx="277" cy="247" r="10" fill="#7b2ff7"/>
<text x="152" y="116" fill="#7fdcf5" font-size="15" font-weight="600" text-anchor="end">radiation dose</text>
<text x="244" y="219" fill="#c9b3f5" font-size="14" font-weight="600" text-anchor="middle" stroke="#0a0a0f" stroke-width="7" paint-order="stroke">sensor health</text>
<line x1="195" y1="535" x2="277" y2="453" stroke="url(#g2)" stroke-width="6"/>
<circle cx="195" cy="535" r="10" fill="#00d4ff"/>
<circle cx="277" cy="453" r="10" fill="#7b2ff7"/>
<text x="152" y="594" fill="#7fdcf5" font-size="15" font-weight="600" text-anchor="end">spacecraft charging</text>
<text x="244" y="491" fill="#c9b3f5" font-size="14" font-weight="600" text-anchor="middle" stroke="#0a0a0f" stroke-width="7" paint-order="stroke">power &#183; battery</text>
<line x1="565" y1="535" x2="483" y2="453" stroke="url(#g3)" stroke-width="6"/>
<circle cx="565" cy="535" r="10" fill="#00d4ff"/>
<circle cx="483" cy="453" r="10" fill="#7b2ff7"/>
<text x="608" y="594" fill="#7fdcf5" font-size="15" font-weight="600" text-anchor="start">solar heating</text>
<text x="516" y="491" fill="#c9b3f5" font-size="14" font-weight="600" text-anchor="middle" stroke="#0a0a0f" stroke-width="7" paint-order="stroke">thermal</text>
<circle cx="380" cy="350" r="78" fill="#12121a" stroke="#2a2a3a" stroke-width="1.5"/>
<rect x="354" y="324" width="52" height="7" rx="3.5" fill="url(#gk)"/>
<circle cx="354" cy="328" r="9" fill="#00d4ff"/>
<circle cx="406" cy="328" r="9" fill="#7b2ff7"/>
<text x="380" y="358" fill="#e0e0e0" font-size="14" font-weight="700" text-anchor="middle">one kernel</text>
<text x="380" y="378" fill="#888" font-size="10" text-anchor="middle" font-family="'SF Mono', Menlo, monospace">predict &#8594; measure</text>
<text x="380" y="393" fill="#888" font-size="10" text-anchor="middle" font-family="'SF Mono', Menlo, monospace">compare &#8594; calibrate &#8635;</text>
<circle cx="70" cy="694" r="6" fill="#7b2ff7"/><text x="82" y="699" fill="#999" font-size="13">internal &#8212; the machine&#8217;s own physics</text>
<circle cx="335" cy="694" r="6" fill="#00d4ff"/><text x="347" y="699" fill="#999" font-size="13">external &#8212; the environment&#8217;s physics</text>
<line x1="600" y1="694" x2="620" y2="694" stroke="#ffd700" stroke-width="2" stroke-dasharray="5 5"/><text x="628" y="699" fill="#999" font-size="13">the hull &#8212; where they drive each other</text>
<text x="742" y="150" fill="#e0e0e0" font-size="24" font-weight="700">What moves &#8212; and what doesn&#8217;t.</text>
<rect x="742" y="186" width="458" height="128" rx="14" fill="#12121a" stroke="#2a2a3a" stroke-width="1.5"/>
<text x="766" y="220" fill="#00d4ff" font-size="11" letter-spacing="2" font-family="'SF Mono', Menlo, monospace">RAW TELEMETRY</text>
<text x="766" y="254" fill="#f2f2f2" font-size="25" font-weight="700">stays aboard</text>
<text x="766" y="280" fill="#999" font-size="13.5">learned from in place, as events unfold —</text>
<text x="766" y="299" fill="#999" font-size="13.5">no downlink loop, no retraining</text>
<rect x="742" y="334" width="458" height="128" rx="14" fill="#12121a" stroke="#2a2a3a" stroke-width="1.5"/>
<text x="766" y="368" fill="#00d4ff" font-size="11" letter-spacing="2" font-family="'SF Mono', Menlo, monospace">LEARNED STRUCTURE</text>
<text x="766" y="402" fill="#f2f2f2" font-size="25" font-weight="700">~1 KB / day</text>
<text x="766" y="428" fill="#999" font-size="13.5">causal vectors move device → device; certainty is</text>
<text x="766" y="447" fill="#999" font-size="13.5">re-earned locally — a lie can’t be inherited</text>
<rect x="742" y="482" width="458" height="128" rx="14" fill="#12121a" stroke="#2a2a3a" stroke-width="1.5"/>
<text x="766" y="516" fill="#00d4ff" font-size="11" letter-spacing="2" font-family="'SF Mono', Menlo, monospace">FOOTPRINT</text>
<text x="766" y="550" fill="#f2f2f2" font-size="22" font-weight="700">&lt;1% CPU &#183; &lt;50 MB &#183; &lt;0.5 W</text>
<text x="766" y="576" fill="#999" font-size="13.5">runs beside flight software on Pi-class compute —</text>
<text x="766" y="595" fill="#999" font-size="13.5">smallsat to robot dog</text>
</svg>